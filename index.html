<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Pink Kitty Shop - Hello Kitty merchandise store with cute products and shopping cart">
<meta name="keywords" content="Hello Kitty, shopping, merchandise, cute, pink">
<title>Pink Kitty Shop 🛍️</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(135deg, #ffe6f0 0%, #fff0f7 100%);
  min-height: 100vh;
  color: #333;
  position: relative;
}

/* Decorative background elements */
body::before {
  content: '💕';
  position: fixed;
  top: 10%;
  left: 5%;
  font-size: 30px;
  opacity: 0.3;
  pointer-events: none;
  z-index: 0;
}

body::after {
  content: '🎀';
  position: fixed;
  bottom: 15%;
  right: 8%;
  font-size: 35px;
  opacity: 0.3;
  pointer-events: none;
  z-index: 0;
}

header {
  background: linear-gradient(135deg, #ff4da6 0%, #ff1f8c 100%);
  color: white;
  padding: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 6px 20px rgba(255, 77, 166, 0.3);
  position: sticky;
  top: 0;
  z-index: 100;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 15px;
}

.menu-btn {
  background: none;
  border: none;
  color: white;
  font-size: 28px;
  cursor: pointer;
  transition: transform 0.3s ease;
}

.menu-btn:hover {
  transform: scale(1.1);
}

.logo {
  font-size: 32px;
}

.header-title {
  font-size: 24px;
  font-weight: bold;
  text-align: center;
  flex: 1;
}

.header-right {
  display: flex;
  gap: 15px;
  align-items: center;
}

.icon-btn {
  background: none;
  border: none;
  color: white;
  font-size: 24px;
  cursor: pointer;
  transition: transform 0.3s ease;
  position: relative;
}

.icon-btn:hover {
  transform: scale(1.1);
}

.cart-count {
  position: absolute;
  top: -8px;
  right: -8px;
  background: white;
  color: #ff4da6;
  border-radius: 50%;
  width: 20px;
  height: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: bold;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 30px 20px;
  position: relative;
  z-index: 1;
}

.products-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 25px;
  margin-bottom: 50px;
}

.product-card {
  background: white;
  border-radius: 20px;
  padding: 20px;
  box-shadow: 0 6px 15px rgba(255, 77, 166, 0.15);
  transition: all 0.3s ease;
  border: 2px solid #ff4da6;
  text-align: center;
  animation: fadeIn 0.6s ease;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.product-card:hover {
  transform: translateY(-10px);
  box-shadow: 0 12px 25px rgba(255, 77, 166, 0.25);
}

.product-image {
  width: 100%;
  height: 150px;
  background: linear-gradient(135deg, #ffe6f0 0%, #fff0f7 100%);
  border-radius: 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 15px;
  border: 2px dashed #ff4da6;
  position: relative;
  overflow: hidden;
  background-size: cover;
  background-position: center;
  cursor: pointer;
}

.product-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 13px;
}

.image-upload-overlay {
  display: none;
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0, 0, 0, 0.7);
  align-items: center;
  justify-content: center;
  z-index: 10;
  border-radius: 15px;
}

.product-image:hover .image-upload-overlay {
  display: flex;
}

.upload-hint {
  color: white;
  text-align: center;
  font-size: 12px;
}

.upload-hint p {
  margin: 5px 0;
}

.hidden-file-input {
  display: none;
}

.product-name {
  color: #ff4da6;
  font-size: 16px;
  font-weight: bold;
  margin-bottom: 10px;
}

.product-price {
  font-size: 18px;
  font-weight: bold;
  color: #333;
  margin-bottom: 15px;
}

.product-description {
  color: #666;
  font-size: 13px;
  margin-bottom: 15px;
  line-height: 1.4;
}

.product-actions {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}

.btn-buy {
  flex: 1;
  background: linear-gradient(135deg, #ff4da6 0%, #ff1f8c 100%);
  color: white;
  border: none;
  padding: 10px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  transition: all 0.3s ease;
}

.btn-buy:hover {
  transform: scale(1.05);
  box-shadow: 0 6px 15px rgba(255, 77, 166, 0.4);
}

.btn-wishlist {
  background: white;
  border: 2px solid #ff4da6;
  color: #ff4da6;
  padding: 8px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 18px;
  transition: all 0.3s ease;
}

.btn-wishlist:hover {
  background: #ffe6f0;
}

.btn-wishlist.active {
  background: #ff4da6;
  color: white;
}

/* Modal Styles */
.modal {
  display: none;
  position: fixed;
  z-index: 1000;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0, 0, 0, 0.5);
  animation: fadeIn 0.3s ease;
  overflow-y: auto;
}

.modal-content {
  background-color: white;
  margin: 10% auto;
  padding: 30px;
  border: 3px solid #ff4da6;
  border-radius: 20px;
  width: 90%;
  max-width: 500px;
  animation: slideIn 0.3s ease;
}

@keyframes slideIn {
  from {
    transform: translateY(-50px);
    opacity: 0;
  }
  to {
    transform: translateY(0);
    opacity: 1;
  }
}

.close {
  color: #ff4da6;
  float: right;
  font-size: 28px;
  font-weight: bold;
  cursor: pointer;
  transition: color 0.3s ease;
}

.close:hover {
  color: #ff1f8c;
}

.modal h2 {
  color: #ff4da6;
  margin-bottom: 20px;
  text-align: center;
}

.cart-empty {
  text-align: center;
  color: #666;
  padding: 40px 20px;
}

.cart-item {
  background: #f8f9fa;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 15px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  border-left: 4px solid #ff4da6;
}

.cart-item-info {
  flex: 1;
}

.cart-item-name {
  color: #ff4da6;
  font-weight: bold;
  margin-bottom: 5px;
}

.cart-item-price {
  color: #333;
  font-size: 14px;
  margin-bottom: 5px;
}

.cart-item-status {
  color: #4caf50;
  font-size: 12px;
  font-weight: bold;
  margin-bottom: 5px;
}

.cart-item-remove {
  background: none;
  border: none;
  color: #d32f2f;
  font-size: 20px;
  cursor: pointer;
  transition: transform 0.3s ease;
}

.cart-item-remove:hover {
  transform: scale(1.2);
}

.cart-total {
  background: linear-gradient(135deg, #ffe6f0 0%, #fff0f7 100%);
  padding: 20px;
  border-radius: 10px;
  text-align: center;
  margin-top: 20px;
  border: 2px solid #ff4da6;
}

.total-amount {
  color: #ff4da6;
  font-size: 28px;
  font-weight: bold;
  margin-bottom: 15px;
}

.btn-checkout {
  width: 100%;
  background: linear-gradient(135deg, #ff4da6 0%, #ff1f8c 100%);
  color: white;
  border: none;
  padding: 15px;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.3s ease;
}

.btn-checkout:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 15px rgba(255, 77, 166, 0.4);
}

.btn-checkout:disabled {
  background: #ccc;
  cursor: not-allowed;
  transform: none;
}

/* Floating Hello Kitty Characters */
.floating-kitty {
  position: fixed;
  font-size: 50px;
  pointer-events: none;
  animation: float 6s ease-in-out infinite;
  z-index: 5;
}

.kitty-left {
  bottom: 20%;
  left: 2%;
}

.kitty-right {
  bottom: 10%;
  right: 2%;
}

@keyframes float {
  0%, 100% {
    transform: translateY(0px);
  }
  50% {
    transform: translateY(-20px);
  }
}

@media (max-width: 768px) {
  .products-grid {
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 15px;
  }

  .header-title {
    font-size: 18px;
  }

  .modal-content {
    width: 95%;
    padding: 20px;
  }
}

@media (max-width: 480px) {
  header {
    padding: 15px;
  }

  .header-title {
    font-size: 16px;
  }

  .products-grid {
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px;
  }

  .product-card {
    padding: 15px;
  }
}
</style>
</head>

<body>

<!-- Floating Hello Kitty Characters -->
<div class="floating-kitty kitty-left">🐱</div>
<div class="floating-kitty kitty-right">🐱</div>

<!-- Header -->
<header>
  <div class="header-left">
    <button class="menu-btn" onclick="toggleMenu()">☰</button>
    <div class="logo">🎀</div>
  </div>
  <div class="header-title">💖 Hello Kitty 💖</div>
  <div class="header-right">
    <button class="icon-btn" onclick="openCart()">
      🛍️
      <span class="cart-count" id="cartCount">0</span>
    </button>
    <button class="icon-btn" onclick="toggleWishlist()">❤️</button>
  </div>
</header>

<!-- Main Container -->
<div class="container">
  <div class="products-grid" id="productsGrid"></div>
</div>

<!-- Cart Modal -->
<div id="cartModal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeCart()">&times;</span>
    <h2>🛍️ Shopping Cart</h2>
    <div id="cartItems"></div>
    <div id="cartTotal"></div>
  </div>
</div>

<script>
// Products Data with default emoji fallback
const products = [
  { id: 1, name: 'Green Jade Pendant', price: 24.99, emoji: '💚', desc: 'Beautiful jade accessory', image: null },
  { id: 2, name: 'Pink Stress Ball', price: 12.99, emoji: '🔴', desc: 'Squeeze for relaxation', image: null },
  { id: 3, name: 'Character Keychains', price: 34.99, emoji: '🔑', desc: 'Cute character collection', image: null },
  { id: 4, name: 'Hair Bows Set', price: 14.99, emoji: '🎀', desc: 'Pink sparkle & satin bows', image: null },
  { id: 5, name: 'Tea Set', price: 34.99, emoji: '☕', desc: 'Cute dinnerware' },
  { id: 6, name: 'Phone Case', price: 19.99, emoji: '📱', desc: 'Protective & cute' },
  { id: 7, name: 'Notebook', price: 8.99, emoji: '📓', desc: 'For daily notes' },
  { id: 8, name: 'Sticker Pack', price: 5.99, emoji: '🌟', desc: 'Fun decorations' },
  { id: 9, name: 'Keychain', price: 9.99, emoji: '🔑', desc: 'Adorable accessory' },
  { id: 10, name: 'Squishy Dumplings', price: 5.00, emoji: '🥟', desc: 'Soft & huggable' }
];

let cart = [];
let wishlist = [];

// Initialize
function init() {
  loadCart();
  loadWishlist();
  loadProductImages();
  renderProducts();
  updateCartCount();
}

// Load images from localStorage
function loadProductImages() {
  const saved = localStorage.getItem('product-images');
  if (saved) {
    const images = JSON.parse(saved);
    products.forEach(product => {
      if (images[product.id]) {
        product.image = images[product.id];
      }
    });
  }
}

// Save images to localStorage
function saveProductImages() {
  const images = {};
  products.forEach(product => {
    if (product.image) {
      images[product.id] = product.image;
    }
  });
  localStorage.setItem('product-images', JSON.stringify(images));
}

// Handle image upload
function handleImageUpload(productId, event) {
  const file = event.target.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = function(e) {
      const product = products.find(p => p.id === productId);
      product.image = e.target.result;
      saveProductImages();
      renderProducts();
      showNotification('Image updated! 📸');
    };
    reader.readAsDataURL(file);
  }
}

// Render Products
function renderProducts() {
  const grid = document.getElementById('productsGrid');
  grid.innerHTML = products.map(product => `
    <div class="product-card">
      <div class="product-image" ${product.image ? `style="background-image: url('${product.image}'); background-size: cover;"` : ''} 
           onclick="document.getElementById('imageInput-${product.id}').click()">
        ${product.image ? '' : `<span style="font-size: 60px;">${product.emoji}</span>`}
        <div class="image-upload-overlay">
          <div class="upload-hint">
            <p>📸</p>
            <p>Click to upload image</p>
          </div>
        </div>
      </div>
      <input type="file" id="imageInput-${product.id}" class="hidden-file-input" accept="image/*" 
             onchange="handleImageUpload(${product.id}, event)">
      <div class="product-name">${product.name}</div>
      <div class="product-price">$${product.price.toFixed(2)}</div>
      <div class="product-description">${product.desc}</div>
      <div class="product-actions">
        <button class="btn-buy" onclick="addToCart(${product.id})">Add to Cart</button>
        <button class="btn-wishlist ${wishlist.includes(product.id) ? 'active' : ''}" 
                onclick="toggleProductWishlist(${product.id})">❤️</button>
      </div>
    </div>
  `).join('');
}

// Cart Functions with Order Tracking
function addToCart(productId) {
  const product = products.find(p => p.id === productId);
  const existingItem = cart.find(item => item.id === productId);
  
  const deliveryDate = new Date();
  deliveryDate.setDate(deliveryDate.getDate() + Math.floor(Math.random() * 3) + 3); // 3-5 days
  
  if (existingItem) {
    existingItem.quantity++;
  } else {
    cart.push({ 
      ...product, 
      quantity: 1,
      orderedDate: new Date().toLocaleDateString(),
      estimatedDelivery: deliveryDate.toLocaleDateString(),
      status: 'Processing'
    });
  }
  
  saveCart();
  updateCartCount();
  showNotification('Added to cart! 💕');
}

function removeFromCart(productId) {
  cart = cart.filter(item => item.id !== productId);
  saveCart();
  updateCartCount();
  renderCart();
}

function openCart() {
  document.getElementById('cartModal').style.display = 'block';
  renderCart();
}

function closeCart() {
  document.getElementById('cartModal').style.display = 'none';
}

function renderCart() {
  const cartItems = document.getElementById('cartItems');
  const cartTotal = document.getElementById('cartTotal');
  
  if (cart.length === 0) {
    cartItems.innerHTML = '<div class="cart-empty">Your cart is empty 💔</div>';
    cartTotal.innerHTML = '';
    return;
  }
  
  const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
  
  cartItems.innerHTML = cart.map(item => `
    <div class="cart-item">
      <div class="cart-item-info">
        <div class="cart-item-name">${item.name}</div>
        <div class="cart-item-price">$${item.price.toFixed(2)} x ${item.quantity}</div>
        <div class="cart-item-status">📦 ${item.status}</div>
        <div style="color: #999; font-size: 11px;">
          📅 Est. Delivery: ${item.estimatedDelivery}
        </div>
      </div>
      <button class="cart-item-remove" onclick="removeFromCart(${item.id})">🗑️</button>
    </div>
  `).join('');
  
  cartTotal.innerHTML = `
    <div class="cart-total">
      <div class="total-amount">Total: $${total.toFixed(2)}</div>
      <button class="btn-checkout" onclick="checkout()">💳 Checkout</button>
    </div>
  `;
}

function checkout() {
  if (cart.length === 0) {
    alert('Your cart is empty! 💔');
    return;
  }
  
  const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
  alert(`Thank you for shopping! 💖\n\nTotal: $${total.toFixed(2)}\n\nYour order has been placed! 🎉\n\nYou'll receive tracking updates soon! 📬`);
  cart = [];
  saveCart();
  updateCartCount();
  closeCart();
}

function updateCartCount() {
  const count = cart.reduce((sum, item) => sum + item.quantity, 0);
  document.getElementById('cartCount').textContent = count;
}

// Wishlist Functions
function toggleProductWishlist(productId) {
  const index = wishlist.indexOf(productId);
  if (index > -1) {
    wishlist.splice(index, 1);
  } else {
    wishlist.push(productId);
  }
  saveWishlist();
  renderProducts();
  showNotification('Wishlist updated! 💕');
}

function toggleWishlist() {
  alert(`You have ${wishlist.length} items in your wishlist! 💕`);
}

// Storage Functions
function saveCart() {
  localStorage.setItem('kitty-shop-cart', JSON.stringify(cart));
}

function loadCart() {
  const saved = localStorage.getItem('kitty-shop-cart');
  cart = saved ? JSON.parse(saved) : [];
}

function saveWishlist() {
  localStorage.setItem('kitty-shop-wishlist', JSON.stringify(wishlist));
}

function loadWishlist() {
  const saved = localStorage.getItem('kitty-shop-wishlist');
  wishlist = saved ? JSON.parse(saved) : [];
}

// Utility Functions
function toggleMenu() {
  alert('Menu: Coming soon! 🎀');
}

function showNotification(message) {
  alert(message);
}

// Close modal when clicking outside
window.onclick = function(event) {
  const modal = document.getElementById('cartModal');
  if (event.target == modal) {
    modal.style.display = 'none';
  }
}

// Initialize on load
window.addEventListener('load', init);
</script>

</body>
</html>
